name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.1'
          channel: 'stable'
          cache: true

      - name: Generate Android platform files
        run: flutter create --platforms=android --org com.sahibi .

      - name: Fix Android SDK and Kotlin settings
        run: |
          echo "Locating app-level Gradle file..."
          APP_GRADLE=""
          if [ -f "android/app/build.gradle.kts" ]; then
            APP_GRADLE="android/app/build.gradle.kts"
          elif [ -f "android/app/build.gradle" ]; then
            APP_GRADLE="android/app/build.gradle"
          else
            echo "Error: Could not find app-level build.gradle file!"
            ls -la android/app/
            exit 1
          fi

          echo "Patching $APP_GRADLE..."
          if [[ "$APP_GRADLE" == *.kts ]]; then
            # Kotlin DSL syntax
            sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 34/g' "$APP_GRADLE"
            sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 24/g' "$APP_GRADLE"
          else
            # Groovy DSL syntax
            sed -i 's/compileSdk flutter.compileSdkVersion/compileSdk 34/g' "$APP_GRADLE"
            sed -i 's/minSdk flutter.minSdkVersion/minSdk 24/g' "$APP_GRADLE"
            sed -i 's/compileSdkVersion flutter.compileSdkVersion/compileSdkVersion 34/g' "$APP_GRADLE"
            sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 24/g' "$APP_GRADLE"
          fi

          if [ -f "android/gradle.properties" ]; then
            echo "android.suppressUnsupportedCompileSdk=34" >> android/gradle.properties
          fi

          echo "Locating root Gradle file..."
          ROOT_GRADLE=""
          if [ -f "android/build.gradle.kts" ]; then
            ROOT_GRADLE="android/build.gradle.kts"
          elif [ -f "android/build.gradle" ]; then
            ROOT_GRADLE="android/build.gradle"
          fi

          if [ -n "$ROOT_GRADLE" ]; then
            echo "Appending Kotlin dependency fixes to $ROOT_GRADLE..."
            if [[ "$ROOT_GRADLE" == *.kts ]]; then
              cat >> "$ROOT_GRADLE" << 'EOF'

          subprojects {
              configurations.all {
                  resolutionStrategy {
                      force("org.jetbrains.kotlin:kotlin-stdlib:1.8.22")
                      force("org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22")
                      force("org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22")
                  }
              }
          }
          EOF
            else
              cat >> "$ROOT_GRADLE" << 'EOF'

          subprojects {
              configurations.all {
                  resolutionStrategy {
                      force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
                      force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'
                      force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
                  }
              }
          }
          EOF
            fi
          fi
          
          echo "Gradle fixes applied successfully."

      - name: Get packages
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
