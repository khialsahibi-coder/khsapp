name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.1'
          channel: 'stable'
          cache: true

      - name: Generate Android platform files
        # FIXED: Changed 'sahibi.vision' to 'com.sahibi' and ensured a space before '.'
        run: flutter create --platforms=android --org com.sahibi .

      - name: Fix Android SDK and Kotlin settings
        run: |
          # 1. Update compileSdk and minSdk safely in app/build.gradle
          sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 34/' android/app/build.gradle
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 24/' android/app/build.gradle
          
          # 2. Add suppression for unsupported compileSdk
          echo "android.suppressUnsupportedCompileSdk=34" >> android/gradle.properties
          
          # 3. Force specific Kotlin stdlib versions
          cat >> android/build.gradle << 'EOF'

          subprojects {
              configurations.all {
                  resolutionStrategy {
                      force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
                      force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'
                      force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
                  }
              }
          }
          EOF

      - name: Get packages
        run: flutter pub get

      - name: Build release APK
        # Uses --no-tree-shake-icons just in case you are using dynamic icons
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
